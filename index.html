<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Krushi | Portfolio</title>


    <!-- Google Font -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">


    <!-- Your CSS -->

    <link rel="stylesheet"
          href="style.css">

</head>


<body>


    <!-- =================================
         LANDING PAGE
    ================================= -->

    <main class="landing-page">

        <div class="greeting"
             id="greeting-text">
        </div>


        <div class="name"
             id="name-text">
        </div>


        <button
            class="know-btn"
            id="know-btn"
            type="button">

            Know More

        </button>

    </main>



    <!-- =================================
         CUBE PAGE
    ================================= -->

    <section
        class="cube-section"
        id="cube-section">


        <!-- Close -->

        <button
            class="close-cube"
            id="close-cube"
            type="button"
            aria-label="Close cube">

            ×

        </button>


        <!-- Heading -->

        <div class="cube-header">

            <span>02 / INTERACTIVE</span>

            <h1>
                Play with it.
            </h1>

        </div>


        <!-- Three.js will create
             the cube here -->

        <div
            id="cube-container">
        </div>


        <!-- Cube moves -->

        <div class="cube-controls">

            <button type="button"
                    data-move="F">
                F
            </button>

            <button type="button"
                    data-move="B">
                B
            </button>

            <button type="button"
                    data-move="R">
                R
            </button>

            <button type="button"
                    data-move="L">
                L
            </button>

            <button type="button"
                    data-move="U">
                U
            </button>

            <button type="button"
                    data-move="D">
                D
            </button>

        </div>


        <!-- Actions -->

        <div class="cube-actions">

            <button
                type="button"
                id="scramble-btn">

                Scramble

            </button>


            <button
                type="button"
                id="reset-btn">

                Reset

            </button>

        </div>


        <p class="cube-hint">

            Drag to rotate •
            Click a letter to turn a layer

        </p>


    </section>



    <!-- =================================
         JAVASCRIPT
    ================================= -->

    <!-- Three.js r160 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>

<!-- Your JavaScript -->
<script src="script.js"></script>


</body>

</html>
